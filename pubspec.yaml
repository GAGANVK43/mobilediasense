name: diasense_mobile
description: "DiaSense Mobile - AI-Powered Personal Health and Diabetes Risk Companion"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  flutter_riverpod: ^2.5.1
  
  # Networking
  dio: ^5.4.3+1
  http_parser: ^4.0.2
  
  # Navigation
  go_router: ^14.0.1
  
  # Secure Storage & Cache
  flutter_secure_storage: ^9.2.1
  shared_preferences: ^2.2.3
  
  # Charts & Visualizations
  fl_chart: ^0.68.0
  
  # UI, Fonts & Polish
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_animate: ^4.5.0
  
  # Image & File Handling
  image_picker: ^1.1.1
  path_provider: ^2.1.3
  open_filex: ^4.4.0
  
  # Utilities
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
